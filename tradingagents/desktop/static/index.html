<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>StockSeek</title>
<link rel="icon" href="stockseek-icon.png" type="image/png">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="strategy-conditions.css">
<script src="components.js" defer></script>
<script src="strategy-conditions.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#content">跳至内容</a>
<aside class="sidebar">
  <div class="brand"><span class="brand-mark" aria-hidden="true"><img src="stockseek-mark.png" width="28" height="28" alt=""></span><div><strong>StockSeek</strong><small>股票研究工作台</small></div></div>
  <div class="nav-caption">工作空间</div>
  <nav aria-label="主导航">
    <button data-page="today" aria-current="page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>今日关注</button>
    <button data-page="research"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H4zM13 7a3 3 0 0 1 3-3h4v15h-3a4 4 0 0 0-4 2"/></svg>股票研究</button>
    <button data-page="dividends"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10m8 10V4m8 16V7M2 20h20"/></svg>高股息</button>
    <button data-page="holdings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18M10 12v3h4v-3"/></svg>持仓管理</button>
    <button data-page="history"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.5 7M3 4v7h7M12 7v5l3 2"/></svg>历史记录</button>
    <button data-page="books"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H4zM13 7a3 3 0 0 1 3-3h4v15h-3a4 4 0 0 0-4 2"/></svg>书籍资料</button>
    <button data-page="strategies"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h11M9 12h11M9 19h11M3 5h1M3 12h1M3 19h1"/></svg>策略管理</button>
  </nav>
  <div class="sidebar-bottom"><div class="local-status"><span class="status-dot"></span>本机工作空间</div><button data-page="settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="5"/></svg>应用设置</button></div>
</aside>
<div class="workspace">
  <header class="topbar"><div class="crumb"><button id="back" hidden>← 返回</button><strong id="page-label">今日关注</strong></div><div class="actions"><button id="theme" class="quiet" aria-label="切换浅色主题"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z"/></svg></button><button data-page="analysis" class="primary"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新建研究</button></div></header>
  <div id="task-strip" class="task-strip" hidden aria-live="polite"></div>
  <main id="content" tabindex="-1"><div class="empty"><span class="eyebrow">StockSeek</span><h1>正在打开本地工作空间</h1><p>正在读取已有报告。</p><p id="connection-note" class="muted">正在连接桌面应用…</p></div></main>
  <div id="footer-status" class="connection-status" role="status" hidden></div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="holding-dialog" aria-labelledby="holding-title">
  <form id="holding-form" novalidate>
    <header class="dialog-header"><div><span class="dialog-eyebrow">持仓记录</span><h2 id="holding-title">维护持仓</h2></div><button type="button" data-action="close-dialog" class="dialog-close quiet" aria-label="关闭"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
    <div class="dialog-body">
      <label class="stock-field">股票代码<div class="input-shell"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input name="ticker" placeholder="例如 601658，自动识别邮储银行" required maxlength="40" autocomplete="off" spellcheck="false" aria-describedby="holding-stock-match"></div><div id="holding-stock-match" class="stock-match" role="status" aria-live="polite">输入代码后自动识别名称与市场</div></label>
      <div class="form-grid"><label>持有数量<div class="input-shell"><input name="quantity" type="number" min="0" step="1" inputmode="numeric" placeholder="0" required><span class="input-unit" aria-hidden="true">股</span></div></label><label>每股成本<div class="input-shell"><input name="cost" type="number" min="0" step="0.0001" inputmode="decimal" placeholder="0.0000" required><span class="input-unit" aria-hidden="true">元</span></div></label></div>
      <label><span>备注 <span class="field-optional">选填</span></span><textarea name="reason" maxlength="10000" placeholder="例如：已按券商账户核对"></textarea></label>
      <p class="form-note">数量为 0 时记录清仓。保存仅更新实际持仓。</p>
    </div>
    <footer class="dialog-footer"><button type="button" data-action="close-dialog" class="quiet">取消</button><button type="submit" class="primary">保存持仓</button></footer>
  </form>
</dialog>
</body>
</html>
